<!doctype html><meta charset=UTF-8><title>ESP32-C3 控制台 - AP设置</title><style>*{box-sizing:border-box}body{background:#f9f9f9;margin:0;padding:0;font-family:Arial,sans-serif}h2{margin-top:0}.section{background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;padding:15px}input,button,textarea{border:1px solid #ccc;border-radius:4px;margin:3px 5px 3px 0;padding:8px 10px}textarea{resize:vertical;width:100%;height:60px;font-family:inherit}button{color:#fff;cursor:pointer;background:#4caf50;border:none;transition:background .2s}button:hover{background:#45a049}button.danger{background:#f44336}button.danger:hover{background:#d32f2f}button.small{background:#2196f3;margin-left:5px;padding:2px 6px;font-size:.7rem}.result{white-space:pre-wrap;word-wrap:break-word;background:#f0f0f0;border-radius:4px;max-height:150px;padding:10px;font-size:.95em;overflow-y:auto}.example{color:#555;background:#f5f5f5;border-radius:3px;margin-top:5px;padding:4px 8px;font-size:.9em;display:inline-block}.nav{color:#fff;text-align:center;background:#333;flex-wrap:wrap;justify-content:center;gap:5px;padding:10px;display:flex}.nav a{color:#fff;cursor:pointer;border-radius:4px;padding:5px 12px;text-decoration:none}.nav a:hover{background:#555}.nav a.active{background:#4caf50}.page{max-width:1200px;margin:0 auto;padding:20px;display:block}.status-grid{grid-template-columns:1fr 1fr;gap:5px;display:grid}.status-item{background:#f5f5f5;border-radius:3px;justify-content:space-between;align-items:center;padding:5px 10px;display:flex}.status-item span{flex:1}.msg-area{white-space:pre-wrap;word-wrap:break-word;background:#e8f4f8;border:1px solid #bcd8e6;border-radius:4px;max-height:200px;padding:10px;font-family:Courier New,monospace;font-size:.9em;line-height:1.6;overflow-y:auto}.device-list,.route-table{white-space:pre-wrap;background:#f0f0f0;border-radius:4px;max-height:200px;padding:10px;font-family:monospace;overflow-y:auto}.route-table{max-height:300px}@media (width<=600px){.status-grid{grid-template-columns:1fr}.nav a{padding:4px 8px;font-size:.85rem}input,button,textarea{width:100%;margin:5px 0}.section{padding:10px}}</style><body><div class=nav><a href=/home>主页</a><a href=/broadcast>广播</a><a href=/unicast>单播</a><a href=/neighbor>邻居表</a><a href=/route>路由表</a><a class=active href=/ap>AP设置</a><a href=/sta>STA设置</a><a href=/udp>UDP设置</a><a href=/system>系统设置</a></div><div class=page><h2>ESP32-C3 控制台 - AP设置</h2><div class=section><h3>查看当前 AP 配置</h3><button onclick=getApConfig()>获取 AP SSID/密码</button><pre id=apConfigDisplay style=background:#f0f0f0;border-radius:4px;margin-top:10px;padding:10px></pre><div class=example>API: /api/get_ap_ssid_password</div></div><div class=section><h3>修改 AP SSID 和密码</h3><label>SSID: <input id=ap_ssid_new placeholder=新SSID></label><label>密码: <input id=ap_password_new placeholder=新密码></label><button onclick=setApSsidPassword()>设置（需重启生效）</button><div class=example>示例: /api/set_ap_ssid_password?ssid=MyAP&password=12345678</div></div><div class=section><h3>AP 网段设置（IP倒数第二段）</h3><label>新网段（如 192.168.<b>5</b>.1）: <input id=ap_net_segment max=255 min=0 type=number value=4></label><button onclick=setApNetSegment()>设置网段（需重启）</button><br><br><button onclick=loadApNetSegment()>获取当前网段</button><div class=example>示例: /api/set_ap_net_segment?segment=5</div></div><div class=section><h3>重置 AP 配置为默认</h3><button onclick=resetApConfig() style=background:#f44336>重置</button><div class=example>API: /api/reset_ap_config</div></div><div class=section><h3>操作结果</h3><div class=result id=result_ap>等待操作...</div></div></div><script>function apiFetch(endpoint,options){return fetch(endpoint,options)}function showResult(containerId,text){let el=document.getElementById(containerId);el&&(el.textContent=text)}function getApConfig(){apiFetch(`/api/get_ap_ssid_password`).then(res=>res.json()).then(data=>{document.getElementById(`apConfigDisplay`).textContent=`SSID: `+(data.ssid||`-`)+`
密码: `+(data.password||`-`)}).catch(err=>{document.getElementById(`apConfigDisplay`).textContent=`获取失败: `+err})}function setApSsidPassword(){var ssid=document.getElementById(`ap_ssid_new`).value.trim(),password=document.getElementById(`ap_password_new`).value.trim();if(!ssid){showResult(`result_ap`,`请输入SSID`);return}apiFetch(`/api/set_ap_ssid_password?ssid=`+encodeURIComponent(ssid)+`&password=`+encodeURIComponent(password),{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_ap`,`设置AP配置: `+data)).catch(err=>showResult(`result_ap`,`请求失败: `+err.toString()))}function setApNetSegment(){var seg=document.getElementById(`ap_net_segment`).value.trim();if(!seg){showResult(`result_ap`,`请输入网段号`);return}apiFetch(`/api/set_ap_net_segment?segment=`+encodeURIComponent(seg),{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_ap`,`设置AP网段: `+data)).catch(err=>showResult(`result_ap`,`请求失败: `+err.toString()))}function resetApConfig(){confirm(`确定重置AP配置为默认值吗？`)&&apiFetch(`/api/reset_ap_config`,{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_ap`,`重置AP配置: `+data)).catch(err=>showResult(`result_ap`,`请求失败: `+err.toString()))}function loadApNetSegment(){apiFetch(`/api/get_ap_status`).then(res=>res.json()).then(data=>{if(data.ip){var parts=data.ip.split(`.`);if(parts.length===4){var segment=parseInt(parts[2]);!isNaN(segment)&&segment>=0&&segment<=255&&(document.getElementById(`ap_net_segment`).value=segment)}}}).catch(err=>console.error(`获取AP状态失败:`,err))}</script>

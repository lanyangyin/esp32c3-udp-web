<!doctype html><meta charset=UTF-8><title>ESP32-C3 控制台 - 系统设置</title><style>*{box-sizing:border-box}body{background:#f9f9f9;margin:0;padding:0;font-family:Arial,sans-serif}h2{margin-top:0}.section{background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;padding:15px}input,button,textarea{border:1px solid #ccc;border-radius:4px;margin:3px 5px 3px 0;padding:8px 10px}textarea{resize:vertical;width:100%;height:60px;font-family:inherit}button{color:#fff;cursor:pointer;background:#4caf50;border:none;transition:background .2s}button:hover{background:#45a049}button.danger{background:#f44336}button.danger:hover{background:#d32f2f}button.small{background:#2196f3;margin-left:5px;padding:2px 6px;font-size:.7rem}.result{white-space:pre-wrap;word-wrap:break-word;background:#f0f0f0;border-radius:4px;max-height:150px;padding:10px;font-size:.95em;overflow-y:auto}.example{color:#555;background:#f5f5f5;border-radius:3px;margin-top:5px;padding:4px 8px;font-size:.9em;display:inline-block}.nav{color:#fff;text-align:center;background:#333;flex-wrap:wrap;justify-content:center;gap:5px;padding:10px;display:flex}.nav a{color:#fff;cursor:pointer;border-radius:4px;padding:5px 12px;text-decoration:none}.nav a:hover{background:#555}.nav a.active{background:#4caf50}.page{max-width:1200px;margin:0 auto;padding:20px;display:block}.status-grid{grid-template-columns:1fr 1fr;gap:5px;display:grid}.status-item{background:#f5f5f5;border-radius:3px;justify-content:space-between;align-items:center;padding:5px 10px;display:flex}.status-item span{flex:1}.msg-area{white-space:pre-wrap;word-wrap:break-word;background:#e8f4f8;border:1px solid #bcd8e6;border-radius:4px;max-height:200px;padding:10px;font-family:Courier New,monospace;font-size:.9em;line-height:1.6;overflow-y:auto}.device-list,.route-table{white-space:pre-wrap;background:#f0f0f0;border-radius:4px;max-height:200px;padding:10px;font-family:monospace;overflow-y:auto}.route-table{max-height:300px}@media (width<=600px){.status-grid{grid-template-columns:1fr}.nav a{padding:4px 8px;font-size:.85rem}input,button,textarea{width:100%;margin:5px 0}.section{padding:10px}}</style><body><div class=nav><a href=/home>主页</a><a href=/broadcast>广播</a><a href=/unicast>单播</a><a href=/neighbor>邻居表</a><a href=/route>路由表</a><a href=/ap>AP设置</a><a href=/sta>STA设置</a><a href=/udp>UDP设置</a><a class=active href=/system>系统设置</a></div><div class=page><h2>ESP32-C3 控制台 - 系统设置</h2><div class=section><h3>本机昵称设置</h3><label>新昵称: <input id=self_nickname_input placeholder=请输入新昵称></label><button onclick=setSelfNickname()>设置（立即生效）</button><br><br><button onclick=getSelfNickname()>获取当前昵称</button><span id=selfNicknameDisplay style=margin-left:10px></span><div class=example>API: /api/set_self_nickname (POST)</div></div><div class=section><h3>LED 引脚配置</h3><label>引脚号: <input id=led_pin_new max=21 min=0 type=number></label><button onclick=setLedPin()>设置（需重启）</button><br><br><button onclick=getLedPin()>获取当前引脚</button><span id=ledPinDisplay style=margin-left:10px></span><div class=example>API: /api/get_led_pin</div></div><div class=section><h3>重置引脚配置</h3><label>引脚号: <input id=reset_pin_new max=21 min=0 type=number value=10></label><button onclick=setResetPin()>设置（需重启）</button><br><br><label>保持时间(秒): <input id=reset_hold_time_new max=60 min=2 type=number value=8></label><button onclick=setResetHoldTime()>设置（需重启）</button><br><br><button onclick=getResetStatus()>获取当前配置</button><span id=resetStatusDisplay style=margin-left:10px></span><div class=example>API: /api/set_reset_pin, /api/set_reset_hold_time, /api/get_reset_status</div></div><div class=section><h3>重启设备</h3><button onclick=rebootDevice() style=background:#f44336>立即重启</button><div class=example>API: /api/reboot</div></div><div class=section><h3>操作结果</h3><div class=result id=result_system>等待操作...</div></div></div><script>function apiFetch(endpoint,options){return fetch(endpoint,options)}function showResult(containerId,text){let el=document.getElementById(containerId);el&&(el.textContent=text)}function setSelfNickname(){var nickname=document.getElementById(`self_nickname_input`).value.trim();if(!nickname){showResult(`result_system`,`请输入新昵称`);return}apiFetch(`/api/set_self_nickname`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({nickname})}).then(res=>res.text()).then(data=>{showResult(`result_system`,`修改本机昵称: `+data),getSelfNickname()}).catch(err=>showResult(`result_system`,`请求失败: `+err.toString()))}function getSelfNickname(){apiFetch(`/api/get_self_mac`).then(res=>res.json()).then(data=>{var mac=data.mac||``;if(!mac){document.getElementById(`selfNicknameDisplay`).textContent=`无法获取MAC`;return}apiFetch(`/api/get_nicknames`).then(res=>res.json()).then(nicks=>{var nick=nicks[mac]||`未设置`;document.getElementById(`selfNicknameDisplay`).textContent=`当前昵称: `+nick,document.getElementById(`self_nickname_input`).value=nick===`未设置`?``:nick}).catch(()=>{document.getElementById(`selfNicknameDisplay`).textContent=`获取昵称失败`})}).catch(()=>{document.getElementById(`selfNicknameDisplay`).textContent=`获取MAC失败`})}function setLedPin(){var pin=document.getElementById(`led_pin_new`).value.trim();if(!pin){showResult(`result_system`,`请输入引脚号`);return}apiFetch(`/api/set_led_pin?pin=`+encodeURIComponent(pin),{method:`POST`}).then(res=>res.text()).then(data=>{showResult(`result_system`,`修改LED引脚: `+data),getLedPin()}).catch(err=>showResult(`result_system`,`请求失败: `+err.toString()))}function getLedPin(){apiFetch(`/api/get_led_pin`).then(res=>res.json()).then(data=>{var pin=data.pin||``;document.getElementById(`led_pin_new`).value=pin,document.getElementById(`ledPinDisplay`).textContent=`当前引脚: GPIO`+(pin||`-`)}).catch(err=>{document.getElementById(`ledPinDisplay`).textContent=`获取失败`})}function setResetPin(){var pin=document.getElementById(`reset_pin_new`).value.trim();if(!pin){showResult(`result_system`,`请输入引脚号`);return}apiFetch(`/api/set_reset_pin`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({pin:parseInt(pin)})}).then(res=>res.text()).then(data=>{showResult(`result_system`,`设置重置引脚: `+data),getResetStatus()}).catch(err=>showResult(`result_system`,`请求失败: `+err.toString()))}function setResetHoldTime(){var seconds=document.getElementById(`reset_hold_time_new`).value.trim();if(!seconds){showResult(`result_system`,`请输入秒数`);return}apiFetch(`/api/set_reset_hold_time`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({seconds:parseInt(seconds)})}).then(res=>res.text()).then(data=>{showResult(`result_system`,`设置保持时间: `+data),getResetStatus()}).catch(err=>showResult(`result_system`,`请求失败: `+err.toString()))}function getResetStatus(){apiFetch(`/api/get_reset_status`).then(res=>res.json()).then(data=>{var pin=data.pin||`未设置`,time=data.hold_time||`未设置`;document.getElementById(`reset_pin_new`).value=pin,document.getElementById(`reset_hold_time_new`).value=time,document.getElementById(`resetStatusDisplay`).textContent=`当前引脚: GPIO`+pin+`, 保持时间: `+time+` 秒`}).catch(err=>{document.getElementById(`resetStatusDisplay`).textContent=`获取失败`})}function rebootDevice(){confirm(`确定要重启设备吗？`)&&apiFetch(`/api/reboot`,{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_system`,`重启: `+data)).catch(err=>showResult(`result_system`,`请求失败: `+err.toString()))}</script>

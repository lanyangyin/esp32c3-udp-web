<!doctype html><meta charset=UTF-8><title>ESP32-C3 控制台 - UDP设置</title><style>*{box-sizing:border-box}body{background:#f9f9f9;margin:0;padding:0;font-family:Arial,sans-serif}h2{margin-top:0}.section{background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;padding:15px}input,button,textarea{border:1px solid #ccc;border-radius:4px;margin:3px 5px 3px 0;padding:8px 10px}textarea{resize:vertical;width:100%;height:60px;font-family:inherit}button{color:#fff;cursor:pointer;background:#4caf50;border:none;transition:background .2s}button:hover{background:#45a049}button.danger{background:#f44336}button.danger:hover{background:#d32f2f}button.small{background:#2196f3;margin-left:5px;padding:2px 6px;font-size:.7rem}.result{white-space:pre-wrap;word-wrap:break-word;background:#f0f0f0;border-radius:4px;max-height:150px;padding:10px;font-size:.95em;overflow-y:auto}.example{color:#555;background:#f5f5f5;border-radius:3px;margin-top:5px;padding:4px 8px;font-size:.9em;display:inline-block}.nav{color:#fff;text-align:center;background:#333;flex-wrap:wrap;justify-content:center;gap:5px;padding:10px;display:flex}.nav a{color:#fff;cursor:pointer;border-radius:4px;padding:5px 12px;text-decoration:none}.nav a:hover{background:#555}.nav a.active{background:#4caf50}.page{max-width:1200px;margin:0 auto;padding:20px;display:block}.status-grid{grid-template-columns:1fr 1fr;gap:5px;display:grid}.status-item{background:#f5f5f5;border-radius:3px;justify-content:space-between;align-items:center;padding:5px 10px;display:flex}.status-item span{flex:1}.msg-area{white-space:pre-wrap;word-wrap:break-word;background:#e8f4f8;border:1px solid #bcd8e6;border-radius:4px;max-height:200px;padding:10px;font-family:Courier New,monospace;font-size:.9em;line-height:1.6;overflow-y:auto}.device-list,.route-table{white-space:pre-wrap;background:#f0f0f0;border-radius:4px;max-height:200px;padding:10px;font-family:monospace;overflow-y:auto}.route-table{max-height:300px}@media (width<=600px){.status-grid{grid-template-columns:1fr}.nav a{padding:4px 8px;font-size:.85rem}input,button,textarea{width:100%;margin:5px 0}.section{padding:10px}}</style><body><div class=nav><a href=/home>主页</a><a href=/broadcast>广播</a><a href=/unicast>单播</a><a href=/neighbor>邻居表</a><a href=/route>路由表</a><a href=/ap>AP设置</a><a href=/sta>STA设置</a><a class=active href=/udp>UDP设置</a><a href=/system>系统设置</a></div><div class=page><h2>ESP32-C3 控制台 - UDP设置</h2><div class=section><h3>UDP 接收端口</h3><label>端口号: <input id=udp_recv_port_new max=65535 min=1 type=number value=8888></label><button onclick=setUdpRecvPort()>设置（需重启）</button><br><br><button onclick=getUdpRecvPort()>获取当前端口</button><div class=example>示例: /api/set_udp_recv_port?port=8889</div></div><div class=section><h3>UDP 广播/单播目标端口</h3><label>端口号: <input id=udp_broadcast_port_new max=65535 min=1 type=number value=8888></label><button onclick=setUdpBroadcastPort()>设置（需重启）</button><br><br><button onclick=getUdpBroadcastPort()>获取当前端口</button><div class=example>示例: /api/set_udp_broadcast_port?port=8888</div></div><div class=section><h3>UDP 消息轮询间隔</h3><label>间隔(毫秒): <input id=poll_interval_new min=500 type=number value=5000></label><button onclick=setPollInterval()>设置（立即生效）</button><br><br><button onclick=getPollInterval()>获取当前间隔</button><div class=example>示例: /api/set_udp_poll_interval?interval=5000</div></div><div class=section><h3>操作结果</h3><div class=result id=result_udp>等待操作...</div></div></div><script>function apiFetch(endpoint,options){return fetch(endpoint,options)}function showResult(containerId,text){let el=document.getElementById(containerId);el&&(el.textContent=text)}function setUdpRecvPort(){var port=document.getElementById(`udp_recv_port_new`).value.trim();if(!port){showResult(`result_udp`,`请输入端口号`);return}apiFetch(`/api/set_udp_recv_port?port=`+encodeURIComponent(port),{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_udp`,`设置接收端口: `+data)).catch(err=>showResult(`result_udp`,`请求失败: `+err.toString()))}function setUdpBroadcastPort(){var port=document.getElementById(`udp_broadcast_port_new`).value.trim();if(!port){showResult(`result_udp`,`请输入端口号`);return}apiFetch(`/api/set_udp_broadcast_port?port=`+encodeURIComponent(port),{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_udp`,`设置目标端口: `+data)).catch(err=>showResult(`result_udp`,`请求失败: `+err.toString()))}function setPollInterval(){var interval=document.getElementById(`poll_interval_new`).value.trim();if(!interval){showResult(`result_udp`,`请输入间隔`);return}apiFetch(`/api/set_udp_poll_interval?interval=`+encodeURIComponent(interval),{method:`POST`}).then(res=>res.text()).then(data=>showResult(`result_udp`,`设置轮询间隔: `+data)).catch(err=>showResult(`result_udp`,`请求失败: `+err.toString()))}function getUdpRecvPort(){apiFetch(`/api/get_udp_recv_port`).then(res=>res.json()).then(data=>{document.getElementById(`udp_recv_port_new`).value=data.value}).catch(err=>console.error(`获取UDP接收端口失败:`,err))}function getUdpBroadcastPort(){apiFetch(`/api/get_udp_broadcast_port`).then(res=>res.json()).then(data=>{document.getElementById(`udp_broadcast_port_new`).value=data.value}).catch(err=>console.error(`获取UDP目标端口失败:`,err))}function getPollInterval(){apiFetch(`/api/get_udp_poll_interval`).then(res=>res.json()).then(data=>{document.getElementById(`poll_interval_new`).value=data.interval||5e3}).catch(err=>console.error(`获取轮询间隔失败:`,err))}</script>

<!doctype html><meta charset=UTF-8><title>ESP32-C3 控制台 - 广播</title><style>*{box-sizing:border-box}body{background:#f9f9f9;margin:0;padding:0;font-family:Arial,sans-serif}h2{margin-top:0}.section{background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;padding:15px}input,button,textarea{border:1px solid #ccc;border-radius:4px;margin:3px 5px 3px 0;padding:8px 10px}textarea{resize:vertical;width:100%;height:60px;font-family:inherit}button{color:#fff;cursor:pointer;background:#4caf50;border:none;transition:background .2s}button:hover{background:#45a049}button.danger{background:#f44336}button.danger:hover{background:#d32f2f}button.small{background:#2196f3;margin-left:5px;padding:2px 6px;font-size:.7rem}.result{white-space:pre-wrap;word-wrap:break-word;background:#f0f0f0;border-radius:4px;max-height:150px;padding:10px;font-size:.95em;overflow-y:auto}.example{color:#555;background:#f5f5f5;border-radius:3px;margin-top:5px;padding:4px 8px;font-size:.9em;display:inline-block}.nav{color:#fff;text-align:center;background:#333;flex-wrap:wrap;justify-content:center;gap:5px;padding:10px;display:flex}.nav a{color:#fff;cursor:pointer;border-radius:4px;padding:5px 12px;text-decoration:none}.nav a:hover{background:#555}.nav a.active{background:#4caf50}.page{max-width:1200px;margin:0 auto;padding:20px;display:block}.status-grid{grid-template-columns:1fr 1fr;gap:5px;display:grid}.status-item{background:#f5f5f5;border-radius:3px;justify-content:space-between;align-items:center;padding:5px 10px;display:flex}.status-item span{flex:1}.msg-area{white-space:pre-wrap;word-wrap:break-word;background:#e8f4f8;border:1px solid #bcd8e6;border-radius:4px;max-height:200px;padding:10px;font-family:Courier New,monospace;font-size:.9em;line-height:1.6;overflow-y:auto}.device-list,.route-table{white-space:pre-wrap;background:#f0f0f0;border-radius:4px;max-height:200px;padding:10px;font-family:monospace;overflow-y:auto}.route-table{max-height:300px}@media (width<=600px){.status-grid{grid-template-columns:1fr}.nav a{padding:4px 8px;font-size:.85rem}input,button,textarea{width:100%;margin:5px 0}.section{padding:10px}}</style><body><div class=nav><a href=/home>主页</a><a class=active href=/broadcast>广播</a><a href=/unicast>单播</a><a href=/neighbor>邻居表</a><a href=/route>路由表</a><a href=/ap>AP设置</a><a href=/sta>STA设置</a><a href=/udp>UDP设置</a><a href=/system>系统设置</a></div><div class=page><h2>ESP32-C3 控制台 - UDP广播</h2><div class=section><h3>AP 广播</h3><label>内容:</label><textarea id=bc_content>Hello</textarea><button onclick=broadcast()>发送</button><div class=example>示例: /api/udp_broadcast (POST JSON)</div></div><div class=section><h3>STA 广播</h3><label>内容:</label><textarea id=sta_bc_content>HelloSTA</textarea><button onclick=staBroadcast()>发送</button><div class=example>示例: /api/udp_broadcast_sta (POST JSON)</div></div><div class=section><h3>AP+STA 同时广播</h3><label>内容:</label><textarea id=both_bc_content>HelloBoth</textarea><button onclick=bothBroadcast()>同时发送</button><div class=example>示例: /api/udp_broadcast_apsta (POST JSON)</div></div><div class=section><h3>UDP 消息列表</h3><div class=msg-area id=udpMsgList_broadcast>等待消息...</div><button onclick="clearUdpMsg('broadcast')" style=background:#f44336>清空</button><button onclick="refreshUdpMessages('broadcast')" style=background:#2196f3>刷新</button><div class=example>API: /api/udp_messages (GET), /api/clear_udp_messages (POST)</div></div><div class=section><h3>操作结果</h3><div class=result id=result_broadcast>等待操作...</div></div></div><script>function apiFetch(endpoint,options){return fetch(endpoint,options)}function showResult(containerId,text){let el=document.getElementById(containerId);el&&(el.textContent=text)}function fetchUdpMessages(containerId){apiFetch(`/api/udp_messages`).then(res=>res.json()).then(data=>{var container=document.getElementById(containerId);if(container){if(data.length===0){container.textContent=`暂无消息`;return}container.textContent=data.map(item=>(/* @__PURE__ */ new Date(item.time*1e3)).toLocaleTimeString()+` `+item.addr+`: `+item.msg).join(`

`)}}).catch(err=>console.error(`获取UDP消息失败:`,err))}function refreshUdpMessages(page){var containerId={broadcast:`udpMsgList_broadcast`,unicast:`udpMsgList_unicast`,neighbor:`udpMsgList_neighbor`,route:`udpMsgList_route`}[page]||`udpMsgList_broadcast`;showResult(`result_`+page,`正在刷新...`),fetchUdpMessages(containerId),showResult(`result_`+page,`刷新完成`)}function clearUdpMsg(page){confirm(`确定清空所有UDP消息记录吗？`)&&apiFetch(`/api/clear_udp_messages`,{method:`POST`}).then(res=>res.text()).then(data=>{showResult(`result_`+page,`清空消息: `+data),refreshUdpMessages(page)}).catch(err=>showResult(`result_`+page,`请求失败: `+err.toString()))}function broadcast(){var content=document.getElementById(`bc_content`).value.trim();if(!content){showResult(`result_broadcast`,`请输入广播内容`);return}apiFetch(`/api/udp_broadcast`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({content})}).then(res=>res.text()).then(data=>showResult(`result_broadcast`,`AP广播: `+data)).catch(err=>showResult(`result_broadcast`,`请求失败: `+err.toString()))}function staBroadcast(){var content=document.getElementById(`sta_bc_content`).value.trim();if(!content){showResult(`result_broadcast`,`请输入广播内容`);return}apiFetch(`/api/udp_broadcast_sta`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({content})}).then(res=>res.text()).then(data=>showResult(`result_broadcast`,`STA广播: `+data)).catch(err=>showResult(`result_broadcast`,`请求失败: `+err.toString()))}function bothBroadcast(){var content=document.getElementById(`both_bc_content`).value.trim();if(!content){showResult(`result_broadcast`,`请输入广播内容`);return}apiFetch(`/api/udp_broadcast_apsta`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({content})}).then(res=>res.text()).then(data=>showResult(`result_broadcast`,`AP+STA广播: `+data)).catch(err=>showResult(`result_broadcast`,`请求失败: `+err.toString()))}</script>

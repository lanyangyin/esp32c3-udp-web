<!doctype html><meta charset=UTF-8><title>ESP32-C3 控制台 - STA设置</title><style>*{box-sizing:border-box}body{background:#f9f9f9;margin:20px;font-family:Arial,sans-serif}h2{margin-top:0}.section{background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;padding:15px}input,button{border:1px solid #ccc;border-radius:4px;margin:3px 5px 3px 0;padding:8px 10px}button{color:#fff;cursor:pointer;background:#4caf50;border:none;transition:background .2s}button:hover{background:#45a049}button.danger{background:#f44336}button.danger:hover{background:#d32f2f}.result{white-space:pre-wrap;word-wrap:break-word;background:#f0f0f0;border-radius:4px;max-height:100px;padding:10px;font-size:.95em;overflow-y:auto}.example{color:#555;background:#f5f5f5;border-radius:3px;margin-top:5px;padding:4px 8px;font-size:.9em;display:inline-block}.nav{color:#fff;text-align:center;background:#333;padding:10px}.nav a{color:#fff;margin:0 10px;text-decoration:none}.nav a:hover{text-decoration:underline}@media (width<=600px){input,button{width:100%;margin:5px 0}.section{padding:10px}}</style><body><div class=nav><a href=/>主页</a> | <a href=/udp_broadcast>广播</a> | <a href=/udp_unicast>单播</a> | <a href=/neighbor>邻居表</a> | <a href=/route>路由表</a> | <a href=/settings/ap>AP设置</a> | <a href=/settings/sta>STA设置</a> | <a href=/settings/udp>UDP设置</a> | <a href=/settings/system>系统设置</a></div><h2>ESP32-C3 控制台 - STA设置</h2><div class=section><h3>查看当前 STA 配置</h3><button onclick=getStaConfig()>获取 STA SSID/密码</button><pre id=staConfigDisplay style=background:#f0f0f0;border-radius:4px;margin-top:10px;padding:10px></pre><div class=example>API: /api/get_sta_ssid_password</div></div><div class=section><h3>修改 STA SSID 和密码</h3><label>SSID: <input id=sta_ssid_new placeholder=新SSID></label><label>密码: <input id=sta_password_new placeholder=新密码></label><button onclick=setStaSsidPassword()>设置（需重启）</button><div class=example>示例: /api/set_sta_ssid_password?ssid=MyWiFi&password=12345678</div></div><div class=section><h3>STA 连接超时</h3><label>超时(秒): <input id=sta_timeout_new min=5 type=number value=60></label><button onclick=setStaTimeout()>设置</button><br><br><button onclick=getStaTimeout()>获取当前超时</button><div class=example>示例: /api/set_sta_timeout?value=30</div></div><div class=section><h3>操作结果</h3><div class=result id=result>等待操作...</div></div><script>function showResult(text){document.getElementById(`result`).textContent=text}function getStaConfig(){fetch(`/api/get_sta_ssid_password`).then(res=>res.json()).then(data=>{document.getElementById(`staConfigDisplay`).textContent=`SSID: `+(data.ssid||`-`)+`
密码: `+(data.password||`-`)}).catch(err=>{document.getElementById(`staConfigDisplay`).textContent=`获取失败: `+err})}function setStaSsidPassword(){var ssid=document.getElementById(`sta_ssid_new`).value.trim(),password=document.getElementById(`sta_password_new`).value.trim();if(!ssid){showResult(`请输入SSID`);return}var url=`/api/set_sta_ssid_password?ssid=`+encodeURIComponent(ssid)+`&password=`+encodeURIComponent(password);fetch(url).then(res=>res.text()).then(data=>showResult(`设置STA配置: `+data)).catch(err=>showResult(`请求失败: `+err.toString()))}function setStaTimeout(){var val=document.getElementById(`sta_timeout_new`).value.trim();if(!val){showResult(`请输入数值`);return}fetch(`/api/set_sta_timeout?value=`+encodeURIComponent(val)).then(res=>res.text()).then(data=>showResult(`设置STA超时: `+data)).catch(err=>showResult(`请求失败: `+err.toString()))}function getStaTimeout(){fetch(`/api/get_sta_timeout`).then(res=>res.json()).then(data=>{document.getElementById(`sta_timeout_new`).value=data.value||60}).catch(err=>console.error(`获取STA超时失败:`,err))}
// 取消自动加载
</script>

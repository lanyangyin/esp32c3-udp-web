<!doctype html><meta charset=UTF-8><title>ESP32-C3 控制台 - 系统设置</title><style>*{box-sizing:border-box}body{background:#f9f9f9;margin:20px;font-family:Arial,sans-serif}h2{margin-top:0}.section{background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;padding:15px}input,button{border:1px solid #ccc;border-radius:4px;margin:3px 5px 3px 0;padding:8px 10px}button{color:#fff;cursor:pointer;background:#4caf50;border:none;transition:background .2s}button:hover{background:#45a049}button.danger{background:#f44336}button.danger:hover{background:#d32f2f}.result{white-space:pre-wrap;word-wrap:break-word;background:#f0f0f0;border-radius:4px;max-height:100px;padding:10px;font-size:.95em;overflow-y:auto}.example{color:#555;background:#f5f5f5;border-radius:3px;margin-top:5px;padding:4px 8px;font-size:.9em;display:inline-block}.nav{color:#fff;text-align:center;background:#333;padding:10px}.nav a{color:#fff;margin:0 10px;text-decoration:none}.nav a:hover{text-decoration:underline}@media (width<=600px){input,button{width:100%;margin:5px 0}.section{padding:10px}}</style><body><div class=nav><a href=/>主页</a> | <a href=/udp_broadcast>广播</a> | <a href=/udp_unicast>单播</a> | <a href=/neighbor>邻居表</a> | <a href=/route>路由表</a> | <a href=/settings/ap>AP设置</a> | <a href=/settings/sta>STA设置</a> | <a href=/settings/udp>UDP设置</a> | <a href=/settings/system>系统设置</a></div><h2>ESP32-C3 控制台 - 系统设置</h2><div class=section><h3>LED 引脚配置</h3><label>引脚号: <input id=led_pin_new max=21 min=0 type=number></label><button onclick=setLedPin()>设置（需重启）</button><br><br><button onclick=getLedPin()>获取当前引脚</button><span id=ledPinDisplay style=margin-left:10px></span><div class=example>API: /api/get_led_pin</div></div><div class=section><h3>重启设备</h3><button onclick=rebootDevice() style=background:#f44336>立即重启</button><div class=example>API: /api/reboot</div></div><div class=section><h3>操作结果</h3><div class=result id=result>等待操作...</div></div><script>function showResult(text){document.getElementById(`result`).textContent=text}function getLedPin(){fetch(`/api/get_led_pin`).then(res=>res.json()).then(data=>{var pin=data.pin||``;document.getElementById(`led_pin_new`).value=pin,document.getElementById(`ledPinDisplay`).textContent=`当前引脚: GPIO`+(pin||`-`)}).catch(err=>{document.getElementById(`ledPinDisplay`).textContent=`获取失败`})}function setLedPin(){var pin=document.getElementById(`led_pin_new`).value.trim();if(!pin){showResult(`请输入引脚号`);return}fetch(`/api/set_led_pin?pin=`+encodeURIComponent(pin)).then(res=>res.text()).then(data=>{showResult(`修改LED引脚: `+data),getLedPin()}).catch(err=>showResult(`请求失败: `+err.toString()))}function rebootDevice(){confirm(`确定要重启设备吗？`)&&fetch(`/api/reboot`).then(res=>res.text()).then(data=>showResult(`重启: `+data)).catch(err=>showResult(`请求失败: `+err.toString()))}
// 取消自动加载
</script>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32-C3 控制台 - UDP设置</title>
    <style>
        /* 样式与 sta.html 相同，此处省略，实际文件需包含完整样式 */
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
        h2 { margin-top: 0; }
        .section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #fff; }
        input, button, textarea { padding: 8px 10px; margin: 3px 5px 3px 0; border: 1px solid #ccc; border-radius: 4px; }
        textarea { width: 100%; height: 60px; resize: vertical; font-family: inherit; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #45a049; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #d32f2f; }
        button.small { padding: 2px 6px; font-size: 0.7rem; margin-left: 5px; background: #2196F3; }
        .result { background: #f0f0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; max-height: 150px; overflow-y: auto; font-size: 0.95em; }
        .example { color: #555; font-size: 0.9em; margin-top: 5px; background: #f5f5f5; padding: 4px 8px; border-radius: 3px; display: inline-block; }
        .nav { background: #333; padding: 10px; color: #fff; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .nav a { color: #fff; padding: 5px 12px; text-decoration: none; border-radius: 4px; cursor: pointer; }
        .nav a:hover { background: #555; }
        .nav a.active { background: #4CAF50; }
        .page { display: block; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .status-item { background: #f5f5f5; padding: 5px 10px; border-radius: 3px; display: flex; justify-content: space-between; align-items: center; }
        .status-item span { flex: 1; }
        .msg-area { background: #e8f4f8; padding: 10px; border-radius: 4px; max-height: 200px; overflow-y: auto; font-size: 0.9em; font-family: 'Courier New', monospace; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #bcd8e6; }
        .device-list, .route-table { background: #f0f0f0; padding: 10px; border-radius: 4px; max-height: 200px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
        .route-table { max-height: 300px; }
        @media (max-width: 600px) {
            .status-grid { grid-template-columns: 1fr; }
            .nav a { padding: 4px 8px; font-size: 0.85rem; }
            input, button, textarea { width: 100%; margin: 5px 0; }
            .section { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="nav">
    <a href="/home">主页</a>
    <a href="/broadcast">广播</a>
    <a href="/unicast">单播</a>
    <a href="/neighbor">邻居表</a>
    <a href="/route">路由表</a>
    <a href="/ap">AP设置</a>
    <a href="/sta">STA设置</a>
    <a href="/udp" class="active">UDP设置</a>
    <a href="/system">系统设置</a>
</div>

<div class="page">
    <h2>ESP32-C3 控制台 - UDP设置</h2>
    <div class="section">
        <h3>UDP 接收端口</h3>
        <label>端口号: <input type="number" id="udp_recv_port_new" min="1" max="65535" value="8888"></label>
        <button onclick="setUdpRecvPort()">设置（需重启）</button>
        <br><br>
        <button onclick="getUdpRecvPort()">获取当前端口</button>
        <div class="example">示例: /api/set_udp_recv_port?port=8889</div>
    </div>
    <div class="section">
        <h3>UDP 广播/单播目标端口</h3>
        <label>端口号: <input type="number" id="udp_broadcast_port_new" min="1" max="65535" value="8888"></label>
        <button onclick="setUdpBroadcastPort()">设置（需重启）</button>
        <br><br>
        <button onclick="getUdpBroadcastPort()">获取当前端口</button>
        <div class="example">示例: /api/set_udp_broadcast_port?port=8888</div>
    </div>
    <div class="section">
        <h3>UDP 消息轮询间隔</h3>
        <label>间隔(毫秒): <input type="number" id="poll_interval_new" min="500" value="5000"></label>
        <button onclick="setPollInterval()">设置（立即生效）</button>
        <br><br>
        <button onclick="getPollInterval()">获取当前间隔</button>
        <div class="example">示例: /api/set_udp_poll_interval?interval=5000</div>
    </div>
    <div class="section">
        <h3>操作结果</h3>
        <div id="result_udp" class="result">等待操作...</div>
    </div>
</div>

<script>
function apiFetch(endpoint, options) {
    return fetch(endpoint, options);
}
function showResult(containerId, text) {
    const el = document.getElementById(containerId);
    if (el) el.textContent = text;
}

function setUdpRecvPort() {
    var port = document.getElementById('udp_recv_port_new').value.trim();
    if (!port) { showResult('result_udp', '请输入端口号'); return; }
    apiFetch('/api/set_udp_recv_port?port=' + encodeURIComponent(port), { method: 'POST' })
        .then(res => res.text())
        .then(data => showResult('result_udp', '设置接收端口: ' + data))
        .catch(err => showResult('result_udp', '请求失败: ' + err.toString()));
}
function setUdpBroadcastPort() {
    var port = document.getElementById('udp_broadcast_port_new').value.trim();
    if (!port) { showResult('result_udp', '请输入端口号'); return; }
    apiFetch('/api/set_udp_broadcast_port?port=' + encodeURIComponent(port), { method: 'POST' })
        .then(res => res.text())
        .then(data => showResult('result_udp', '设置目标端口: ' + data))
        .catch(err => showResult('result_udp', '请求失败: ' + err.toString()));
}
function setPollInterval() {
    var interval = document.getElementById('poll_interval_new').value.trim();
    if (!interval) { showResult('result_udp', '请输入间隔'); return; }
    apiFetch('/api/set_udp_poll_interval?interval=' + encodeURIComponent(interval), { method: 'POST' })
        .then(res => res.text())
        .then(data => showResult('result_udp', '设置轮询间隔: ' + data))
        .catch(err => showResult('result_udp', '请求失败: ' + err.toString()));
}
function getUdpRecvPort() {
    apiFetch('/api/get_udp_recv_port')
        .then(res => res.json())
        .then(data => {
            document.getElementById('udp_recv_port_new').value = data.value;
        })
        .catch(err => console.error('获取UDP接收端口失败:', err));
}
function getUdpBroadcastPort() {
    apiFetch('/api/get_udp_broadcast_port')
        .then(res => res.json())
        .then(data => {
            document.getElementById('udp_broadcast_port_new').value = data.value;
        })
        .catch(err => console.error('获取UDP目标端口失败:', err));
}
function getPollInterval() {
    apiFetch('/api/get_udp_poll_interval')
        .then(res => res.json())
        .then(data => {
            document.getElementById('poll_interval_new').value = data.interval || 5000;
        })
        .catch(err => console.error('获取轮询间隔失败:', err));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>ESP32-C3 控制台 - 系统设置</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
h2 { margin-top: 0; }
.section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #fff; }
input, button { padding: 8px 10px; margin: 3px 5px 3px 0; border: 1px solid #ccc; border-radius: 4px; }
button { background: #4CAF50; color: white; border: none; cursor: pointer; transition: background 0.2s; }
button:hover { background: #45a049; }
button.danger { background: #f44336; }
button.danger:hover { background: #d32f2f; }
.result { background: #f0f0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; max-height: 100px; overflow-y: auto; font-size: 0.95em; }
.example { color: #555; font-size: 0.9em; margin-top: 5px; background: #f5f5f5; padding: 4px 8px; border-radius: 3px; display: inline-block; }
.nav { background: #333; padding: 10px; color: #fff; text-align: center; }
.nav a { color: #fff; margin: 0 10px; text-decoration: none; }
.nav a:hover { text-decoration: underline; }
@media (max-width: 600px) { input, button { width: 100%; margin: 5px 0; } .section { padding: 10px; } }
</style>
</head>
<body>
<div class="nav">
  <a href="/">主页</a> |
  <a href="/udp_broadcast">广播</a> |
  <a href="/udp_unicast">单播</a> |
  <a href="/neighbor">邻居表</a> |
  <a href="/route">路由表</a> |
  <a href="/settings/ap">AP设置</a> |
  <a href="/settings/sta">STA设置</a> |
  <a href="/settings/udp">UDP设置</a> |
  <a href="/settings/system">系统设置</a>
</div>
<h2>ESP32-C3 控制台 - 系统设置</h2>

<div class="section">
  <h3>LED 引脚配置</h3>
  <label>引脚号: <input type="number" id="led_pin_new" min="0" max="21"></label>
  <button onclick="setLedPin()">设置（需重启）</button>
  <div class="example">示例: /api/set_led_pin?pin=8</div>
  <br>
  <button onclick="getLedPin()">获取当前引脚</button>
  <span id="ledPinDisplay" style="margin-left: 10px;"></span>
  <div class="example">API: /api/get_led_pin</div>
</div>

<div class="section">
  <h3>重启设备</h3>
  <button onclick="rebootDevice()" style="background:#f44336;">立即重启</button>
  <div class="example">API: /api/reboot</div>
</div>

<div class="section">
  <h3>操作结果</h3>
  <div id="result" class="result">等待操作...</div>
</div>

<script>
function showResult(text) {
    document.getElementById('result').textContent = text;
}

function getLedPin() {
    fetch('/api/get_led_pin')
        .then(res => res.json())
        .then(data => {
            var pin = data.pin || '';
            document.getElementById('led_pin_new').value = pin;
            document.getElementById('ledPinDisplay').textContent = '当前引脚: GPIO' + (pin || '-');
        })
        .catch(err => {
            document.getElementById('ledPinDisplay').textContent = '获取失败';
        });
}

function setLedPin() {
    var pin = document.getElementById('led_pin_new').value.trim();
    if (!pin) { showResult('请输入引脚号'); return; }
    fetch('/api/set_led_pin?pin=' + encodeURIComponent(pin))
        .then(res => res.text())
        .then(data => {
            showResult('修改LED引脚: ' + data);
            getLedPin();
        })
        .catch(err => showResult('请求失败: ' + err.toString()));
}

function rebootDevice() {
    if (!confirm('确定要重启设备吗？')) return;
    fetch('/api/reboot')
        .then(res => res.text())
        .then(data => showResult('重启: ' + data))
        .catch(err => showResult('请求失败: ' + err.toString()));
}

// 页面加载自动获取引脚
getLedPin();
</script>
</body>
</html>
